name: Build APKForge AI installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows EXE and MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate source
        run: npm run check
      - name: Run unit tests
        run: npm test
      - name: Build Windows installers
        run: npm run desktop:win
      - uses: actions/upload-artifact@v4
        with:
          name: apkforge-ai-windows-installers
          path: |
            release/*.exe
            release/*.msi
          if-no-files-found: error
          retention-days: 14


  preview-screenshots:
    name: Capture desktop and mobile preview screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install application dependencies
        run: npm install
      - name: Install browser screenshot tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture screenshots
        run: |
          mkdir -p artifacts
          node scripts/capture-preview.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: apkforge-ai-preview-screenshots
          path: artifacts/*.png
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install
      - name: Validate source
        run: npm run check
      - name: Run unit tests
        run: npm test
      - name: Create Capacitor Android project
        run: npx cap add android
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apkforge-ai-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
